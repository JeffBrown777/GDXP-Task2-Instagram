name: GDXP Task 2 Instagram

on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Task 2 PHX lane"
        required: false
        type: choice
        options:
          - "09"
          - "15"
  push:
    paths:
      - "task2-trigger.txt"

permissions:
  contents: write

concurrency:
  group: gdxp-task2-instagram
  cancel-in-progress: false

jobs:
  task2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Resolve Task 2 lane
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
              echo "TASK2_SLOT=09" >> "$GITHUB_ENV"
            else
              echo "TASK2_SLOT=15" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.slot }}" ]; then
            echo "TASK2_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif grep -Eqi '(9AM|09|9:00)' task2-trigger.txt 2>/dev/null; then
            echo "TASK2_SLOT=09" >> "$GITHUB_ENV"
          elif grep -Eqi '(3PM|15|3:00)' task2-trigger.txt 2>/dev/null; then
            echo "TASK2_SLOT=15" >> "$GITHUB_ENV"
          else
            echo "TASK2_SLOT=15" >> "$GITHUB_ENV"
          fi

      - name: Instagram authorization gate
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::TASK 2 HOLD — IG_ACCESS_TOKEN is absent. Publication was not attempted."
            exit 1
          fi
          echo "TASK 2 AUTH READY"

      - name: Reconstruct approved PNG assets if needed
        run: python bootstrap_assets.py

      - name: Publish reconstructed assets to raw GitHub if newly created
        run: |
          if git status --porcelain -- png/ | grep -q .; then
            git config user.name "gdxp-task2"
            git config user.email "gdxp-task2@users.noreply.github.com"
            git add png/
            git commit -m "Materialize approved Task 2 PNG assets"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            sleep 15
          fi

      - name: Publish next approved PNG
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_IMAGE_BASE_URL: https://raw.githubusercontent.com/JeffBrown777/GDXP-Task2-Instagram/main/png
          IG_API_VERSION: v24.0
          IG_GRAPH_HOST: https://graph.instagram.com
          IG_EXPECTED_USERNAME: jeffbrown3579
          TASK2_SLOT: ${{ env.TASK2_SLOT }}
        run: python task2_instagram_publisher.py

      - name: Verify Instagram publication receipt
        env:
          TASK2_SLOT: ${{ env.TASK2_SLOT }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          slot = os.environ["TASK2_SLOT"]
          today = datetime.now(ZoneInfo("America/Phoenix")).date().isoformat()
          slot_id = f"{today}-{slot}"

          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          matches = [x for x in state.get("posted", []) if x.get("slot") == slot_id]
          if not matches:
              raise SystemExit(f"TASK 2 HOLD — no Instagram receipt recorded for {slot_id}")

          receipt = matches[-1]
          required = ("filename", "media_id", "permalink", "timestamp", "username")
          missing = [k for k in required if not str(receipt.get(k, "")).strip()]
          if missing:
              raise SystemExit("TASK 2 HOLD — incomplete Instagram receipt: " + ", ".join(missing))

          if str(receipt.get("username", "")).lower() != "jeffbrown3579":
              raise SystemExit("TASK 2 HOLD — receipt account mismatch")

          print("TASK 2 VERIFIED INSTAGRAM RECEIPT")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Commit verified Task 2 receipt state
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "gdxp-task2"
          git config user.email "gdxp-task2@users.noreply.github.com"
          git add state.json
          git commit -m "Task 2 Instagram receipt state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Task 2 PASS close
        run: echo "TASK 2 PASS — VERIFIED INSTAGRAM PUBLICATION RECEIPT — CLOSE"
